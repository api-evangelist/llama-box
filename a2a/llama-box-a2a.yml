discovery:
  path: /yo/.well-known/agent.json
  canonical: false
  host: llama.box
  mount: /yo
  note: >-
    Served at the LEGACY pre-0.3 filename (agent.json) AND under a sub-path: the FastAPI service is mounted
    at https://llama.box/yo behind Caddy, and the card is one of its routes (operationId
    agent_card__well_known_agent_json_get in the same app's OpenAPI). Neither RFC 8615 host-root path
    exists — https://llama.box/.well-known/agent-card.json and /.well-known/agent.json both 404 (0 bytes,
    Caddy) — and the canonical filename under the mount, /yo/.well-known/agent-card.json, returns the app's
    JSON 404 ({"detail":"Not Found"}, 22 bytes). A client that derives the card location from the host will
    not find it; a2aregistry.org lists the sub-path as wellKnownURI, which is how it entered the harvest
    backlog. A negative-control path under the mount (/yo/.well-known/llama-box-negative-control-7f3ab91c.json)
    also 404s, so the 200 is a served document and not a catch-all. Ownership: the card's
    provider.organization is "Chado Studio"; the OpenAPI on the same mount titles itself "crvUSD Yield
    Optimizer API" 1.1.0 with the identical description text, /yo/health self-identifies as
    "crvusd-yield-optimizer-api" 1.1.0, and /yo/api/pricing names api@chado.studio as the contact.
