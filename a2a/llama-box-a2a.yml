agent_card:
  name: crvUSD Yield Optimizer
  description: >-
    Multi-chain crvUSD yield optimizer agent. Discovers yield opportunities across scrvUSD, LlamaLend,
    Convex and StakeDAO on Ethereum, Arbitrum, Optimism and Fraxtal. Provides real-time APY data, risk
    scoring (0-100), and portfolio rebalance recommendations. Accepts natural language queries.
  url: https://llama.box/yo
  rpc_endpoint_observed: https://llama.box/yo/a2a
  version: 1.1.0
  protocol_version: 0.2.5
  preferred_transport: null
  provider:
    organization: Chado Studio
    url: https://chado.studio
  capabilities:
    streaming: true
    push_notifications: false
    state_transition_history: true
  default_input_modes: [application/json, text/plain]
  default_output_modes: [application/json, text/plain]
  security_schemes: null
  security: null
  documentation_url: null
  icon_url: null
  skill_count: 4
  skills:
  - {id: best-yield, name: Best Yield Finder, tags: [yield, apy, defi, crvusd], rest_operation: best_yield_api_best_yield_get}
  - {id: pools, name: Pool Discovery, tags: [pools, list, filter, defi], rest_operation: list_pools_api_pools_get}
  - {id: risk-score, name: Risk Assessment, tags: [risk, assessment, score, safety], rest_operation: risk_score_api_risk_score__pool_id__get}
  - {id: rebalance, name: Rebalance Advisor, tags: [rebalance, portfolio, allocation, strategy], rest_operation: simulate_rebalance_api_rebalance_post}
  skill_invocation: >-
    Per the /a2a operation description in the OpenAPI: message/send with a TextPart in natural language, or
    with params.skill set to one of the four ids and a DataPart carrying the structured parameters
    ({"chain":"ethereum","top":5}). The rest_operation column is the REST twin each skill's description
    names; it is a reading of the two documents side by side, not a provider-published mapping.
conformance:
  spec: A2A 1.0.0
  grade: near-conformant
  protocol_version: '0.2.5'
  preferred_transport: null
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    All three hard checks pass — capabilities is an object (streaming, pushNotifications,
    stateTransitionHistory), protocolVersion is present ("0.2.5"), skills is an array of four skills each
    with id, name, description, tags and examples. preferredTransport is absent, so the grade is
    near-conformant rather than conformant, the same basis on which the catalog graded ActiveCampaign.
    defaultInputModes and defaultOutputModes are present.
  deviations:
  - no-preferredTransport
  - field: discovery path
    observed: /yo/.well-known/agent.json
    note: Legacy filename, and not at the host root. See discovery.note.
  - field: url
    observed: https://llama.box/yo
    note: >-
      Not the JSON-RPC endpoint. GET and POST to it both return an empty 404 from Caddy; the handler is
      https://llama.box/yo/a2a. A client that POSTs to the card's url as the spec directs gets nothing back.
  - field: protocolVersion
    observed: '0.2.5'
    note: A pre-0.3 revision — no preferredTransport, no additionalInterfaces, no supportedInterfaces. Recorded, not penalised beyond the optional-field grade.
  - field: securitySchemes / security / capabilities.extensions
    observed: absent
    note: >-
      The card declares no authentication and no payment extension, yet every RPC call is gated by x402
      (HTTP 402 with a PAYMENT-REQUIRED header, $0.01 USDC on Base Sepolia) and the REST contract accepts an
      optional X-API-Key that bypasses it. Unlike cards that declare the a2a-x402 extension, an agent
      reading this card cannot learn from it that payment is the access model; it discovers that on its
      first 402.
  - field: x402 challenge resource.url
    observed: https://llama.box/a2a
    note: The challenge names the route without the /yo mount prefix, so the resource URL in the payment requirement does not match the URL the request was sent to (https://llama.box/yo/a2a). Observed, not interpreted.
  - field: provider.url
    observed: https://chado.studio
    note: Does not resolve in DNS (2026-09-19). The only working contact found is api@chado.studio in /yo/api/pricing.
  - field: documentationUrl / iconUrl / signatures
    observed: absent
    note: Swagger UI at https://llama.box/yo/docs and the OpenAPI at /yo/openapi.json exist but are not linked from the card; no JWS signature block.
  - field: description chains vs OpenAPI description
    observed: card lists Ethereum, Arbitrum, Optimism, Fraxtal; the OpenAPI info.description adds Base
    note: The two documents on the same mount disagree on whether Base is a supported chain. Recorded as a divergence between provider documents.
surface_relationship:
  note: >-
    One FastAPI app at https://llama.box/yo carries both surfaces: ten REST operations (openapi/) and the
    A2A JSON-RPC handler at /a2a plus its SSE twin at /a2a/stream. The four skills map one-to-one onto the
    two free reads and the two paid operations; the paid REST calls and the A2A calls share the same x402
    price list at /api/pricing. No MCP server exists on this host (POST tools/list to /yo and /yo/mcp both
    404), and no other llama.box dashboard exposes an API of its own.
