aid: llama-box
name: Chado Studio
description: >-
  Chado Studio (contact api@chado.studio) operates llama.box, a desktop-style hub for the Curve Finance
  ecosystem — dashboards, analytics and curated links for Curve, crvUSD, LlamaLend, YieldBasis, Convex,
  Stake DAO, Yearn and Resupply. Its one machine-readable surface is the crvUSD Yield Optimizer, a FastAPI
  service mounted at https://llama.box/yo that discovers crvUSD yield across scrvUSD, LlamaLend, Convex and
  StakeDAO on Ethereum, Arbitrum, Base, Optimism and Fraxtal, scores pool risk 0-100 and simulates
  rebalances. It publishes an OpenAPI 3.1.0 contract (10 operations) at /yo/openapi.json with Swagger UI and
  ReDoc, an A2A 0.2.5 agent card at /yo/.well-known/agent.json declaring four skills, and charges for the
  risk, rebalance and A2A calls per request through the x402 protocol in USDC on the Base Sepolia testnet.
  The hub itself serves an llms.txt and a robots.txt that allows every major AI crawler.
