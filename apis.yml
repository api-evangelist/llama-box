apis:
- aid: llama-box:crvusd-yield-optimizer-a2a-agent
  name: crvUSD Yield Optimizer A2A Agent
  description: >-
    Agent2Agent surface of the same service: an agent card at https://llama.box/yo/.well-known/agent.json
    (protocolVersion 0.2.5, version 1.1.0, provider "Chado Studio") declaring four skills — Best Yield
    Finder, Pool Discovery, Risk Assessment and Rebalance Advisor — that accept natural-language or structured
    DataPart input. The JSON-RPC 2.0 handler is POST https://llama.box/yo/a2a (message/send, tasks/get,
    tasks/cancel, plus legacy SendMessage/GetTask/CancelTask/ListTasks aliases) with an SSE message/stream
    twin at /yo/a2a/stream; both answered an unpaid probe with HTTP 402 and an x402 v2 PAYMENT-REQUIRED
    challenge for $0.01 USDC on Base Sepolia (eip155:84532). The card's own url (https://llama.box/yo)
    is not the RPC endpoint and 404s on GET and POST.
  image: https://llama.box/og-cover.png
  humanURL: https://llama.box/yo/docs
  baseURL: https://llama.box/yo/a2a
  tags:
