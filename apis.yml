apis:
- aid: llama-box:crvusd-yield-optimizer-api
  name: crvUSD Yield Optimizer API
  description: >-
    REST contract for the crvUSD Yield Optimizer (OpenAPI 3.1.0, info.version 1.1.0, servers[] "/yo" on
    llama.box). Free, unauthenticated reads list and filter crvUSD yield pools across chains and sources
    (offset/limit pagination, up to 500 per page) and return the top-N pools by APY; a per-pool risk score
    (0-100) and a portfolio rebalance simulation are paid per request via x402 ($0.005 and $0.01 in USDC on
    Base Sepolia), or unlocked by an optional X-API-Key. Also exposes the A2A JSON-RPC endpoint, an SSE
    streaming twin, a machine-readable pricing document, a public in-memory access log and a health check.
    Swagger UI at /yo/docs and ReDoc at /yo/redoc are the provider's own renders of the same contract.
  image: https://llama.box/og-cover.png
  humanURL: https://llama.box/yo/docs
  baseURL: https://llama.box/yo
  tags:
  - DeFi
  - Yield
  - crvUSD
  - Risk Scoring
  - x402
  properties:
  - type: OpenAPI
    url: openapi/llama-box-crvusd-yield-optimizer-openapi.yml
  - type: OpenAPI
    name: crvUSD Yield Optimizer API OpenAPI (provider-hosted)
    url: https://llama.box/yo/openapi.json
  - type: APIReference
    url: https://llama.box/yo/docs
  - type: Documentation
    url: https://llama.box/yo/redoc
  - type: Overlay
    url: overlays/llama-box-crvusd-yield-optimizer-overlay.yaml
- aid: llama-box:crvusd-yield-optimizer-a2a-agent
  name: crvUSD Yield Optimizer A2A Agent
  description: >-
    Agent2Agent surface of the same service: an agent card at https://llama.box/yo/.well-known/agent.json
    (protocolVersion 0.2.5, version 1.1.0, provider "Chado Studio") declaring four skills — Best Yield
    Finder, Pool Discovery, Risk Assessment and Rebalance Advisor — that accept natural-language or
    structured DataPart input. The JSON-RPC 2.0 handler is POST https://llama.box/yo/a2a (message/send,
    tasks/get, tasks/cancel, plus legacy SendMessage/GetTask/CancelTask/ListTasks aliases) with an SSE
    message/stream twin at /yo/a2a/stream; both answered an unpaid probe with HTTP 402 and an x402 v2
    PAYMENT-REQUIRED challenge for $0.01 USDC on Base Sepolia (eip155:84532). The card's own url
    (https://llama.box/yo) is not the RPC endpoint and 404s on GET and POST.
  image: https://llama.box/og-cover.png
  humanURL: https://llama.box/yo/docs
  baseURL: https://llama.box/yo/a2a
  tags:
  - A2A
  - Agents
  - agent-native
  - x402
  properties:
  - type: AgentCard
    url: a2a/llama-box-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted, legacy path under /yo)
    url: https://llama.box/yo/.well-known/agent.json
