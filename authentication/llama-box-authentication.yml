  headline: >-
    The contract declares NO components.securitySchemes and no security[] requirement — derive-authentication.py
    found nothing to profile — yet six of its ten operations accept an optional X-API-Key header as an ordinary
    parameter, and the live service enforces it: an invalid key returns 401 {"detail":"Invalid API key"}. The
    real gate on the four paid operations is x402 payment (HTTP 402 with a PAYMENT-REQUIRED header, USDC on
