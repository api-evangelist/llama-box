media_type: application/json
auth:
  style: >-
    Two gates, neither a securityScheme: an optional X-API-Key header parameter that the service validates
    (401 on a bad key) and that unlocks the paid operations for an unpublished "pro or enterprise tier"; and
    x402 payment — a paid operation called without a key answers 402 with a PAYMENT-REQUIRED header and is
    retried with an X-PAYMENT header. Six operations are free and need neither.
  detail: authentication/llama-box-authentication.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  scope: []
  retention: undocumented
  description: >-
    No Idempotency-Key header, parameter or body field exists on any operation and no retry guidance is
    published. The mutating surface is small: POST /a2a (message/send creates a task, per the operation
    description), POST /a2a/stream, and POST /api/rebalance — which despite the verb is a pure simulation
    ("Simulate rebalance: accept current allocation, suggest optimal") and moves nothing. The only replay
    consideration is economic: each paid request is settled per call via x402 (challenge maxTimeoutSeconds
    300), so a retried paid call that succeeded the first time is paid twice. The x402 payment authorization
    itself is single-use by construction of the "exact" scheme, but that protects the payer from double
    settlement of ONE signature, not from re-sending a second one.
  gaps:
  - No idempotency key on POST /a2a, the one operation that creates server-side state (a task).
  - No documented safe-retry guidance for an ambiguous outcome (timeout after a paid call).
dry_run_mode:
  supported: false
  status: not-applicable-for-most-of-the-surface
  note: >-
    The API is advisory: it never executes a trade, deposit or rebalance on-chain. POST /api/rebalance IS the
    rehearsal (a simulation that returns a strategy and actions[] for a human or agent to act on elsewhere),
    so there is nothing further to dry-run. The two free reads (/api/pools, /api/best-yield) let an agent
    obtain pool_ids and preview candidates before paying for a risk score or a simulation. No free twin of
    the paid calls exists.
reversibility:
  grade: documented
  docs: https://llama.box/yo/openapi.json
  note: >-
    A reversal path exists for the one state-creating operation — tasks/cancel on the A2A endpoint — but no
    window inside which it works is stated, so the grade is documented (0.4), not verified. No API operation
    here moves funds, so there is no financial action to reverse beyond the x402 payment itself, for which
    no refund path is published. Nothing below asserts a window the provider has not written down.
  write_surfaces:
  - operation: a2a_endpoint_a2a_post (message/send)
    action: Create a task for the agent (natural-language or structured skill request)
    reversal: tasks/cancel
    reversal_operation: 'a2a_endpoint_a2a_post with method tasks/cancel (also the legacy alias CancelTask)'
    window: null
    stated_terms:
    - source: $.paths['/a2a'].post.description
      verbatim: 'tasks/cancel: Cancel a running task'
    grade: documented
    note: Only "running" tasks are named as cancellable; no duration, retention or refund statement accompanies it.
  - operation: a2a_stream_endpoint_a2a_stream_post (message/stream)
    action: Same as above, streamed over SSE
    reversal: tasks/cancel (via /a2a)
    window: null
    grade: documented
  - operation: simulate_rebalance_api_rebalance_post
    action: Compute a recommended allocation
    reversal: na
    window: null
    grade: na
    note: A simulation with no side effect; nothing to reverse.
  - operation: x402 payment on any paid call
    action: Settle $0.005-$0.01 USDC (Base Sepolia testnet) to 0x6a1175D0EA0e6817786Ce51F1C4F3294F907f410
    reversal: none documented
    window: null
    grade: none
    note: No refund or dispute path is published; the only contact is api@chado.studio. On the testnet the value at risk is faucet USDC.
